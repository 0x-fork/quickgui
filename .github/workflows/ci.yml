name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos-quality:
    name: macOS quality gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Verify release metadata
        id: release
        shell: bash
        run: scripts/release-metadata.sh "$GITHUB_OUTPUT"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.90.0 --profile minimal
          rustup default stable
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-stable-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check release-gate scripts
        run: bash -n scripts/*.sh
      - name: Run all tests
        run: scripts/with-macos-ghostty-zig.sh cargo test --all-targets --all-features --locked
      - name: Check every target and feature
        run: scripts/with-macos-ghostty-zig.sh cargo check --all-targets --all-features --locked
      - name: Check minimum supported Rust version
        run: scripts/with-macos-ghostty-zig.sh cargo +1.90.0 check --all-targets --all-features --locked
      - name: Run Clippy
        run: scripts/with-macos-ghostty-zig.sh cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: scripts/with-macos-ghostty-zig.sh cargo doc --no-deps --all-features --locked
      - name: Verify publish archives and downstream installation
        env:
          QUICKGUI_PACKAGE_TARGET_DIR: target/package-gate
          QUICKGUI_PACKAGE_TOOLCHAIN: 1.90.0
        run: scripts/package-release-gate.sh
      - name: Upload verified release-candidate crates
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quickgui-${{ steps.release.outputs.version }}-crates-${{ github.sha }}
          path: |
            target/package-gate/package/*.crate
            target/package-gate/package/SHA256SUMS
            CHANGELOG.md
            docs/releasing.md
          if-no-files-found: error
          retention-days: 30

  portable-check:
    name: ${{ matrix.name }} compile gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux MSRV
            os: ubuntu-latest
            toolchain: 1.90.0
          - name: Windows
            os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.toolchain }}-
      - name: Check every target and feature
        run: cargo check --all-targets --all-features --locked

  release:
    name: Publish tagged release
    if: github.repository == 'egoist/quickgui' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos-quality
      - portable-check
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.90.0 --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tagged release metadata
        id: release
        run: scripts/release-metadata.sh "$GITHUB_OUTPUT"
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build macOS native packages
        run: |
          bun run build:native --target aarch64-apple-darwin
          bun run build:native --target x86_64-apple-darwin
      - name: Test JavaScript packages
        run: |
          bun run test:js
          bun run typecheck:js
      - name: Build and verify npm tarballs
        run: scripts/package-npm-release.sh target/npm-release
      - name: Verify registry publication plan
        run: |
          scripts/release-crates.sh --check
          scripts/release-npm.sh --check target/npm-release
      - name: Upload npm release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quickgui-${{ steps.release.outputs.npm-version }}-npm-${{ github.sha }}
          path: |
            target/npm-release/*.tgz
            target/npm-release/NPM_SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish Rust crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: scripts/release-crates.sh --publish
      - name: Publish npm packages
        run: scripts/release-npm.sh --publish target/npm-release
      - name: Verify public registry installs
        run: >-
          scripts/release-registry-smoke.sh
          '${{ steps.release.outputs.rust-version }}'
          '${{ steps.release.outputs.npm-version }}'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_VERSION: ${{ steps.release.outputs.rust-version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "QuickGUI $RUST_VERSION"
            gh release upload "$GITHUB_REF_NAME" target/npm-release/*.tgz target/npm-release/NPM_SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "QuickGUI $RUST_VERSION" \
              --generate-notes \
              target/npm-release/*.tgz \
              target/npm-release/NPM_SHA256SUMS
          fi
