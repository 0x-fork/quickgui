[package]
name = "quickgui-native-napi"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
napi = { version = "3.12.2", features = ["napi9"] }
napi-derive = "3.6.3"
quickgui = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.4.1"

[dev-dependencies]
quickgui = { path = "../..", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
