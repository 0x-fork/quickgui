[package]
name = "quickgui-native-napi"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
napi = { version = "3.12.2", features = ["napi9"] }
napi-derive = "3.6.3"
quickgui = { path = "../..", features = ["swift-ui", "terminal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[build-dependencies]
napi-build = "2.4.1"

[dev-dependencies]
quickgui = { path = "../..", features = ["test-support"] }

# Match the root crate's development profile. The hosted view builds deep retained trees through
# one recursive element constructor; unoptimized frames overflow the default test-thread stack
# long before the optimized production addon would.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
