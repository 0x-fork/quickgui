[package]
name = "quickgui-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Cross-platform operating-system services for QuickGUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/egoist/quickgui"

[features]
default = ["autostart", "protocol", "secure-storage", "updater"]
autostart = ["dep:auto-launch"]
protocol = ["dep:dirs", "dep:dunce", "dep:rust-ini", "dep:winreg"]
secure-storage = ["dep:keyring"]
updater = [
  "dep:base64",
  "dep:minisign-verify",
  "dep:semver",
  "dep:serde",
  "dep:serde_json",
  "dep:tempfile",
  "dep:ureq",
]

[dependencies]
auto-launch = { version = "0.6.0", optional = true }
base64 = { version = "0.22.1", optional = true }
keyring = { version = "4.1.6", optional = true }
minisign-verify = { version = "0.2.4", optional = true }
semver = { version = "1.0.27", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tempfile = { version = "3.23.0", optional = true }
thiserror = "2.0"
ureq = { version = "3.4.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dirs = { version = "6.0.0", optional = true }
rust-ini = { version = "0.21.3", optional = true }

[target.'cfg(windows)'.dependencies]
dunce = { version = "1.0.5", optional = true }
winreg = { version = "0.55.0", optional = true }
