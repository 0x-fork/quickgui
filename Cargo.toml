[package]
name = "quickgui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A damage-driven, GPU-accelerated desktop GUI foundation"
documentation = "https://docs.rs/quickgui"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/egoist/quickgui"
keywords = ["gui", "wgpu", "desktop", "graphics"]
categories = ["gui", "graphics"]
exclude = ["/vendor"]

[features]
default = []
inspector = []
test-support = []

[dependencies]
accesskit = "0.24.1"
accesskit_winit = { package = "quickgui-accesskit-winit", path = "vendor/accesskit_winit", version = "=0.33.2-quickgui.1" }
async-task = "4.7"
bitflags = "2.9"
bytemuck = { version = "1.23", features = ["derive"] }
flate2 = "1.1"
glyphon = { package = "quickgui-glyphon", path = "vendor/glyphon", version = "=0.12.0-quickgui.1" }
image-codecs = { package = "image", version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lyon = { version = "1.0.19", default-features = false }
pollster = "0.4"
pulldown-cmark = "0.13"
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taffy = { version = "0.13.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
thiserror = "2.0"
tracing = "0.1"
unicode-segmentation = "1.12"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
winit = { package = "quickgui-winit", path = "vendor/winit", version = "=0.30.13-quickgui.1" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5.1"
core-foundation = "0.9.4"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSAlert", "NSApplication", "NSBox", "NSButton", "NSCell", "NSColor", "NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSTextField", "NSView", "NSWindow", "NSWindowTabGroup", "NSWorkspace", "block2", "objc2-quartz-core"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSBundle", "NSGeometry", "NSNotification", "NSRange", "NSSet", "NSString", "NSURL", "NSUUID"] }
objc2-quartz-core = { version = "0.2.2", features = ["CALayer", "CAMetalLayer"] }
objc2-user-notifications = { version = "0.2.2", features = ["UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }
raw-window-metal = "1.1.0"
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles", "vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3.4", features = ["json"] }

[[bench]]
name = "virtual_list"
harness = false

[[bench]]
name = "picker"
harness = false

[[bench]]
name = "animation"
harness = false

[profile.dev]
opt-level = 3
# The examples are interactive performance probes. Keeping debug assertions enabled makes objc2
# verify every AppKit message signature at runtime and makes `cargo run --example ...` measure the
# validation layer instead of QuickGUI's steady-state rendering path.
debug-assertions = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
