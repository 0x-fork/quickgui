[package]
name = "quickgui-benchmark-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
quickgui = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Keep this fixture independent of the repository workspace.
[workspace]
